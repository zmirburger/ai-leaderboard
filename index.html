<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>AI Leader Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📊</text></svg>">
<style>
  :root {
    --bg: #fafaf8;
    --surface: #ffffff;
    --surface-2: #f3f3ee;
    --text: #1a1a1a;
    --text-muted: #666661;
    --text-dim: #9b9b94;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.16);
    --accent: #2563eb;
    --accent-bg: rgba(37,99,235,0.08);
    --success-bg: rgba(34,197,94,0.12);
    --success-text: #15803d;
    --radius: 12px;
    --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --surface: #161616;
      --surface-2: #1f1f1f;
      --text: #ededed;
      --text-muted: #a0a0a0;
      --text-dim: #666;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.16);
      --accent: #60a5fa;
      --accent-bg: rgba(96,165,250,0.12);
      --success-bg: rgba(34,197,94,0.18);
      --success-text: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .meta { font-size: 12px; color: var(--text-dim); margin: 0 0 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .refresh-btn { background: transparent; border: 0.5px solid var(--border-strong); color: var(--text-muted); font-size: 12px; padding: 4px 10px; border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; }
  .refresh-btn:hover { color: var(--text); border-color: var(--text-muted); }
  .section-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; margin: 0 0 12px; font-weight: 500; }
  .winner-card {
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 28px;
  }
  .winner-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; gap: 12px; }
  .badge { background: var(--accent-bg); color: var(--accent); font-size: 10.5px; padding: 3px 10px; border-radius: var(--radius-sm); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 500; }
  .winner-name { font-size: 26px; font-weight: 600; margin: 8px 0 2px; letter-spacing: -0.015em; }
  .winner-vendor { font-size: 12px; color: var(--text-muted); margin: 0; }
  .composite { text-align: right; }
  .composite-label { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; margin: 0; }
  .composite-value { font-size: 24px; font-weight: 600; margin: 4px 0 0; letter-spacing: -0.015em; }
  .composite-value .denom { font-size: 14px; color: var(--text-muted); font-weight: 400; }
  .winner-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; padding-top: 14px; border-top: 0.5px solid var(--border); }
  .winner-grid .label { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 4px; }
  .winner-grid .val { font-size: 14px; font-weight: 500; margin: 0; }
  .winner-grid .val .rank { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .rationale { font-size: 13px; color: var(--text-muted); margin: 14px 0 0; line-height: 1.55; }
  .runners { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--surface-2); color: var(--text-muted); font-size: 11.5px; padding: 4px 10px; border-radius: var(--radius-sm); }
  .priority-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 28px; }
  @media (max-width: 520px) { .priority-grid { grid-template-columns: 1fr; } }
  .calibrating-chip { background: rgba(234, 179, 8, 0.15); color: #ca8a04; font-size: 10.5px; padding: 1px 7px; border-radius: var(--radius-sm); font-weight: 500; }
  @media (prefers-color-scheme: dark) { .calibrating-chip { background: rgba(234, 179, 8, 0.2); color: #facc15; } }
  .cov-chip { background: var(--surface-2); color: var(--text-dim); font-size: 10.5px; padding: 1px 7px; border-radius: var(--radius-sm); font-weight: 500; }
  .pri-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .pri-tag { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 8px; }
  .pri-name { font-size: 16px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.005em; }
  .pri-summary { font-size: 12px; color: var(--text-muted); margin: 0 0 4px; line-height: 1.45; }
  .pri-supporting { font-size: 11px; color: var(--text-dim); margin: 0; }
  .pri-rank { width: 100%; border-collapse: collapse; margin-top: 4px; }
  .pri-rank td { padding: 4px 0; font-size: 13px; vertical-align: baseline; }
  .pri-rank td:last-child { text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .pri-rank tr:first-child td { font-weight: 600; color: var(--text); }
  .pri-rank tr:first-child td:last-child { color: var(--accent); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 0.5px solid var(--border); margin-bottom: 18px; }
  .tab-btn { background: transparent; border: 0; color: var(--text-muted); font-size: 13.5px; padding: 9px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit; font-weight: 500; }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--text); }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  .model-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .model-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; transition: border-color 0.12s; }
  .model-card:hover { border-color: var(--border-strong); }
  .model-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .model-name { font-size: 14px; font-weight: 600; margin: 0; }
  .model-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .new-chip { background: var(--success-bg); color: var(--success-text); font-size: 10.5px; padding: 1px 7px; border-radius: var(--radius-sm); font-weight: 500; }
  .tier-chip { background: var(--surface-2); color: var(--text-dim); font-size: 10.5px; padding: 1px 7px; border-radius: var(--radius-sm); font-weight: 500; }
  .model-vendor { font-size: 12px; color: var(--text-muted); margin: 2px 0 0; }
  .chev { font-size: 9px; color: var(--text-dim); transition: transform 0.15s; }
  .model-card.open .chev { transform: rotate(180deg); }
  .model-changelog { display: none; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--border); }
  .model-card.open .model-changelog { display: block; }
  .model-changelog p { font-size: 12.5px; color: var(--text-muted); margin: 0 0 8px; line-height: 1.55; }
  .model-changelog a { font-size: 12px; color: var(--accent); text-decoration: none; }
  .model-changelog a:hover { text-decoration: underline; }
  .changelog-head { color: var(--text); font-weight: 500; }
  .bench-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 24px; }
  .bench-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .bench-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; gap: 10px; }
  .bench-name { font-size: 13.5px; font-weight: 600; margin: 0; }
  .bench-link { font-size: 11.5px; color: var(--accent); text-decoration: none; white-space: nowrap; }
  .bench-link:hover { text-decoration: underline; }
  .bench-desc { font-size: 11.5px; color: var(--text-muted); margin: 0 0 10px; }
  .bench-table { width: 100%; border-collapse: collapse; }
  .bench-table td { padding: 3px 0; font-size: 12.5px; }
  .bench-table td:last-child { text-align: right; color: var(--text-muted); }
  .footer-note { font-size: 11px; color: var(--text-dim); margin: 24px 0 0; text-align: center; line-height: 1.5; }
  .footer-note a { color: var(--text-muted); text-decoration: none; }
  .footer-note a:hover { color: var(--text); }
  .subtabs { display: flex; gap: 6px; margin: 6px 0 10px; }
  .subtab-btn { background: var(--surface-2); border: 0.5px solid var(--border); color: var(--text-muted); font-size: 12.5px; padding: 6px 13px; cursor: pointer; border-radius: var(--radius-sm); font-family: inherit; font-weight: 500; }
  .subtab-btn.active { color: var(--text); border-color: var(--border-strong); background: var(--surface); }
  .subpane { display: none; }
  .subpane.active { display: block; }
  .cl-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 8px 16px 12px; }
  .cl-table { width: 100%; border-collapse: collapse; }
  .cl-table td { padding: 7px 0; font-size: 13px; border-bottom: 0.5px solid var(--border); vertical-align: baseline; }
  .cl-table tr:last-child td { border-bottom: 0; }
  .cl-table td:last-child { text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cl-table tr:first-child td:last-child { color: var(--accent); font-weight: 600; }
  .cl-rank { color: var(--text-dim); font-variant-numeric: tabular-nums; margin-right: 6px; }
  .effort-chip { background: var(--surface-2); color: var(--text-dim); font-size: 10px; padding: 1px 6px; border-radius: var(--radius-sm); font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; margin-left: 6px; }
  .cl-note { font-size: 11px; color: var(--text-dim); margin: 8px 2px 0; line-height: 1.5; }
  .value-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
  .value-chart-wrap { position: relative; }
  #value-chart { width: 100%; height: auto; display: block; overflow: visible; }
  .vc-grid { stroke: var(--border); stroke-width: 1; }
  .vc-axis-label { fill: var(--text-dim); font-size: 9.5px; }
  .vc-frontier-line { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .vc-dot-dominated { fill: var(--text-dim); opacity: 0.55; cursor: pointer; }
  .vc-dot-frontier { fill: var(--accent); cursor: pointer; }
  .vc-dot-frontier:hover, .vc-dot-dominated:hover { opacity: 1; }
  .vc-dot-estimated-ring { fill: none; stroke: var(--text-dim); stroke-width: 1; stroke-dasharray: 2 2; pointer-events: none; }
  .vc-label { fill: var(--text-muted); font-size: 9.5px; font-weight: 500; pointer-events: none; }
  .est-chip { color: var(--text-dim); font-size: 10px; font-weight: 500; border: 0.5px dashed var(--border-strong); border-radius: var(--radius-sm); padding: 0 5px; margin-left: 5px; cursor: help; }
  .top3-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .top3-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 14px; position: relative; }
  .top3-rank { position: absolute; top: 10px; right: 12px; font-size: 20px; font-weight: 700; color: var(--border-strong); }
  .top3-model { font-size: 14px; font-weight: 600; margin: 0 0 2px; padding-right: 20px; }
  .top3-vendor { font-size: 11px; color: var(--text-muted); margin: 0 0 10px; }
  .top3-stats { display: flex; gap: 14px; margin-bottom: 8px; }
  .top3-stat .n { font-size: 16px; font-weight: 600; }
  .top3-stat .l { font-size: 9.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; }
  .top3-why { font-size: 11px; color: var(--text-muted); margin: 0; line-height: 1.45; }
  @media (max-width: 580px) { .top3-grid { grid-template-columns: 1fr; } }
  .value-tooltip { position: absolute; pointer-events: none; background: var(--surface-2); border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); padding: 6px 9px; font-size: 11.5px; line-height: 1.5; color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.12); display: none; white-space: nowrap; z-index: 5; }
  .value-tooltip .vt-name { font-weight: 600; }
  .value-tooltip .vt-sub { color: var(--text-muted); }
  .value-legend { display: flex; gap: 16px; margin-top: 8px; font-size: 11px; color: var(--text-muted); }
  .value-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .value-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .value-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  .value-table th { text-align: left; font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 500; padding: 0 0 6px; border-bottom: 0.5px solid var(--border); }
  .value-table th:not(:first-child), .value-table td:not(:first-child) { text-align: right; padding-left: 10px; }
  .value-table td { padding: 6px 0; font-size: 12.5px; border-bottom: 0.5px solid var(--border); vertical-align: baseline; }
  .value-table tr:last-child td { border-bottom: 0; }
  .value-table .vt-model { color: var(--text); font-weight: 500; }
  .value-table .vt-delta { color: var(--text-dim); font-size: 11px; }
  .skip-list { margin-top: 4px; }
  .skip-row { font-size: 12px; color: var(--text-muted); padding: 5px 0; border-bottom: 0.5px solid var(--border); }
  .skip-row:last-child { border-bottom: 0; }
  .skip-row .sr-name { color: var(--text); }
  .skip-row .sr-arrow { color: var(--text-dim); margin: 0 4px; }
  .skip-row .sr-target { color: var(--accent); font-weight: 500; }
  .dbg-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .dbg-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .dbg-total { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dbg-total b { color: var(--text); font-size: 15px; }
  .dbg-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .dbg-table th { text-align: right; font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 500; padding: 0 0 6px 8px; border-bottom: 0.5px solid var(--border); }
  .dbg-table th:first-child, .dbg-table td:first-child { text-align: left; padding-left: 0; }
  .dbg-table td { text-align: right; padding: 6px 0 6px 8px; font-size: 12.5px; border-bottom: 0.5px solid var(--border); vertical-align: top; }
  .dbg-table tr.dbg-sum td { border-bottom: 0; font-weight: 600; }
  .dbg-table tr.dbg-main td { border-bottom: 0; padding-bottom: 0; }
  .dbg-table td.dbg-basis { font-size: 11px; color: var(--text-dim); line-height: 1.45; text-align: left; padding: 2px 0 7px; }
  td.dbg-basis .ev { color: var(--text-muted); }
  .dbg-status { font-size: 10px; font-weight: 500; color: var(--text-dim); margin-left: 4px; white-space: nowrap; }
  .dbg-status.dbg-provisional, .dbg-flag { color: #ca8a04; }
  .dbg-status.dbg-none { color: #dc2626; }
  .dbg-formula { font-size: 11.5px; color: var(--text-muted); margin: 8px 0 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  .loading { text-align: center; color: var(--text-dim); padding: 60px 0; font-size: 13px; }
  @media (max-width: 580px) {
    body { padding: 16px 12px 32px; font-size: 14px; }
    h1 { font-size: 20px; }
    .winner-card { padding: 16px 18px; }
    .winner-name { font-size: 22px; }
    .composite-value { font-size: 22px; }
    .priority-grid { grid-template-columns: 1fr; }
    .model-grid { grid-template-columns: 1fr; }
    .bench-grid { grid-template-columns: 1fr; }
    .winner-grid .label { font-size: 10px; }
    .filter-section { flex-direction: column; align-items: flex-start; gap: 6px; }
    .model-checklist-grid { grid-template-columns: 1fr; }
  }
  .weight-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .weight-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .weight-title {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
  }
  .weight-total-badge {
    background: var(--surface-2);
    color: var(--text-muted);

  }

    display: flex;

    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .weight-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 18px;
  }
  @media (max-width: 580px) {
    .weight-grid { grid-template-columns: 1fr; }
  }

    display: flex;
    flex-direction: column;

  }
  .weight-item-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

    font-size: 12.5px;

<body>
<div class="wrap">
  <header>
    <h1>AI Leader Dashboard</h1>
  </header>
  <div class="meta">
    <span id="last-updated">Loading…</span>
    <span style="color: var(--text-dim);">·</span>
    <span id="weights-meta">Weights: 25 acc · 25 ctx · 25 agent · 25 cost</span>
    <button class="refresh-btn" onclick="location.reload()">Reload</button>
  </div>
  <div id="controls-section">
    <div id="weight-panel-container"></div>
    <div id="filter-bar-container"></div>
  </div>
  <div id="content" class="loading">Loading dashboard data…</div>

<script>
const fmt = (d) => {
  if (!d) return '—';
  const dt = new Date(d);
  return isNaN(dt) ? '—' : dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
};
const daysSince = (d) => {
  if (!d) return NaN;
  return Math.floor((Date.now() - new Date(d)) / 86400000);
};

// ---------- cost/intelligence frontier ----------
// A entry "dominates" another if it's at least as cheap AND at least as smart,
// and strictly better on one axis. Non-dominated entries form the frontier:
// the only configs worth paying for. Everything else has a strictly-as-good-or-better
// option sitting at equal or lower cost.
function dominates(a, b) {
  return a.cost_per_task_usd <= b.cost_per_task_usd
    && a.intelligence_index >= b.intelligence_index
    && (a.cost_per_task_usd < b.cost_per_task_usd || a.intelligence_index > b.intelligence_index);
}
function computeFrontier(rawEntries) {
  const entries = rawEntries.map((e, i) => ({ ...e, _i: i }));
  const frontier = entries.filter(e => !entries.some(o => o._i !== e._i && dominates(o, e)));
  return entries.map(e => {
    if (frontier.includes(e)) return { ...e, frontier: true };
    const dominators = frontier.filter(f => dominates(f, e));
    const strict = dominators.filter(f => f.cost_per_task_usd < e.cost_per_task_usd && f.intelligence_index > e.intelligence_index);
    const pick = (strict.length ? strict : dominators).sort((a, b) => a.cost_per_task_usd - b.cost_per_task_usd)[0];
    return { ...e, frontier: false, dominated_by: pick };
  });
}

function renderValueChart(annotated) {
  const W = 640, H = 300, ML = 36, MR = 14, MT = 12, MB = 28;
  const costs = annotated.map(e => e.cost_per_task_usd);
  const intels = annotated.map(e => e.intelligence_index);
  const xMin = Math.min(...costs) * 0.6, xMax = Math.max(...costs) * 1.3;
  const yMin = Math.floor((Math.min(...intels) - 2) / 5) * 5, yMax = Math.ceil((Math.max(...intels) + 2) / 5) * 5;
  const lx = v => Math.log10(v);
  const xPx = v => ML + (lx(v) - lx(xMin)) / (lx(xMax) - lx(xMin)) * (W - ML - MR);
  const yPx = v => H - MB - (v - yMin) / (yMax - yMin) * (H - MT - MB);

  const xTicks = [0.1, 0.3, 1, 3].filter(t => t > xMin && t < xMax);
  const yTicks = [];
  for (let v = yMin; v <= yMax; v += 5) yTicks.push(v);

  const frontierPts = annotated.filter(e => e.frontier).sort((a, b) => a.cost_per_task_usd - b.cost_per_task_usd);
  const linePath = frontierPts.map((p, i) => `${i === 0 ? 'M' : 'L'}${xPx(p.cost_per_task_usd).toFixed(1)},${yPx(p.intelligence_index).toFixed(1)}`).join(' ');

  const gridlines = yTicks.map(v => `<line class="vc-grid" x1="${ML}" x2="${W - MR}" y1="${yPx(v).toFixed(1)}" y2="${yPx(v).toFixed(1)}" />`).join('');
  const yLabels = yTicks.map(v => `<text class="vc-axis-label" x="${ML - 6}" y="${(yPx(v) + 3).toFixed(1)}" text-anchor="end">${v}</text>`).join('');
  const xLabels = xTicks.map(v => `<text class="vc-axis-label" x="${xPx(v).toFixed(1)}" y="${H - MB + 16}" text-anchor="middle">$${v}</text>`).join('');

  const dots = annotated.map(e => {
    const cx = xPx(e.cost_per_task_usd).toFixed(1), cy = yPx(e.intelligence_index).toFixed(1);
    const cls = e.frontier ? 'vc-dot-frontier' : 'vc-dot-dominated';
    const r = e.frontier ? 5 : 3.5;
    let tip = e.frontier
      ? `${e.model} · Intelligence ${e.intelligence_index} · $${e.cost_per_task_usd.toFixed(2)}/task`
      : `${e.model} · Intelligence ${e.intelligence_index} · $${e.cost_per_task_usd.toFixed(2)}/task ‒ use ${e.dominated_by.model} instead`;
    if (e.estimated) tip += ' (estimated, not directly sourced)';
    const ring = e.estimated ? `<circle class="vc-dot-estimated-ring" cx="${cx}" cy="${cy}" r="${r + 3}"></circle>` : '';
    return `<circle class="${cls}" cx="${cx}" cy="${cy}" r="${r}" data-tip="${tip.replace(/"/g, '&quot;')}"></circle>${ring}`;
  }).join('');

  // Center each label above its point (so it never collides with the marker
  // itself), staggered at two heights and skipped when it would overlap the
  // previous label's span (estimated from character count, ~9.5px font).
  // Always keep the priciest point so the top of the frontier is never unlabeled.
  let lastLabelRight = -Infinity, labelCount = 0;
  const labels = frontierPts.map((p, i) => {
    const cx = xPx(p.cost_per_task_usd), cy = yPx(p.intelligence_index);
    const isLast = i === frontierPts.length - 1;
    const short = p.model.replace('Claude ', '').replace('GPT-5.6 ', '');
    const estWidth = short.length * 5.3;
    const left = cx - estWidth / 2;
    if (left < lastLabelRight + 8 && !isLast) return '';
    lastLabelRight = left + estWidth;
    const dy = labelCount % 2 === 0 ? -10 : -21;
    labelCount++;
    return `<text class="vc-label" x="${cx.toFixed(1)}" y="${(cy + dy).toFixed(1)}" text-anchor="middle">${short}</text>`;
  }).join('');

  return `
    <div class="value-chart-wrap">
      <svg id="value-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cost per task vs Intelligence Index scatter chart">
        ${gridlines}${yLabels}${xLabels}
        <path class="vc-frontier-line" d="${linePath}" />
        ${dots}
        ${labels}
      </svg>
      <div class="value-tooltip" id="value-tooltip"></div>
    </div>
    <div class="value-legend">
      <span><i style="background:var(--accent)"></i>Frontier (worth the price)</span>
      <span><i style="background:var(--text-dim);opacity:0.55"></i>Dominated (skip it)</span>
      <span><i style="background:transparent;border:1px dashed var(--text-dim);width:9px;height:9px;"></i>Estimated (see note)</span>
    </div>
  `;
}

function renderValueTab(d) {
  const ce = d.cost_efficiency;
  if (!ce || !ce.entries || !ce.entries.length) return '';
  const annotated = computeFrontier(ce.entries);
  const frontier = annotated.filter(e => e.frontier).sort((a, b) => a.cost_per_task_usd - b.cost_per_task_usd);
  const dominated = annotated.filter(e => !e.frontier).sort((a, b) => (b.dominated_by.intelligence_index - b.intelligence_index) - (a.dominated_by.intelligence_index - a.intelligence_index));
  const estChip = (e) => e.estimated ? `<span class="est-chip" title="${(e.estimate_basis || 'Estimated — not directly sourced').replace(/"/g, '&quot;')}">est.</span>` : '';

  // Top 5 for everyday use: highest intelligence-per-dollar among frontier options only
  // (the frontier already screens out anything a cheaper/smarter pick beats outright;
  // ranking by raw ratio there favors solid daily-driver picks over the priciest tip).
  const top5 = [...frontier].sort((a, b) => (b.intelligence_index / b.cost_per_task_usd) - (a.intelligence_index / a.cost_per_task_usd)).slice(0, 5);

  const frontierRows = frontier.map((p, i) => {
    const prev = frontier[i - 1];
    let delta = '—';
    if (prev) {
      const dIntel = p.intelligence_index - prev.intelligence_index;
      const dCost = p.cost_per_task_usd - prev.cost_per_task_usd;
      const perPoint = dIntel > 0 ? ` ($${(dCost / dIntel).toFixed(2)}/pt)` : '';
      delta = dIntel > 0 ? `+${dIntel} for +$${dCost.toFixed(2)}${perPoint}` : `+$${dCost.toFixed(2)}, no gain`;
    }
    return `<tr>
      <td class="vt-model">${p.model}${estChip(p)}</td>
      <td>${p.intelligence_index}</td>
      <td>$${p.cost_per_task_usd.toFixed(2)}</td>
      <td class="vt-delta">${delta}</td>
    </tr>`;
  }).join('');

  const skipRows = dominated.map(e => `
    <div class="skip-row">
      <span class="sr-name">${e.model}</span>${estChip(e)} <span style="color:var(--text-dim)">($${e.cost_per_task_usd.toFixed(2)}, intelligence ${e.intelligence_index})</span>
      <span class="sr-arrow">→</span> use <span class="sr-target">${e.dominated_by.model}</span> instead
      <span style="color:var(--text-dim)">(${e.dominated_by.cost_per_task_usd < e.cost_per_task_usd ? 'cheaper' : 'same price'}${e.dominated_by.intelligence_index > e.intelligence_index ? ', smarter' : ', same score'})</span>
    </div>`).join('');

  const top5Cards = top5.map((p, i) => `
    <div class="top3-card">
      <span class="top3-rank">${i + 1}</span>
      <p class="top3-model">${p.model}${estChip(p)}</p>
      <p class="top3-vendor">${p.vendor}</p>
      <div class="top3-stats">
        <div class="top3-stat"><div class="n">${p.intelligence_index}</div><div class="l">Intelligence</div></div>
        <div class="top3-stat"><div class="n">$${p.cost_per_task_usd.toFixed(2)}</div><div class="l">Per task</div></div>
      </div>
      <p class="top3-why">${(p.intelligence_index / p.cost_per_task_usd).toFixed(0)} intelligence points per dollar — on the frontier, and not paying for headroom an everyday task won't use.</p>
    </div>`).join('');

  return `
    <p class="section-label" style="margin-top:8px;">Top 5 for everyday tasks</p>
    <div class="top3-grid" style="margin-bottom:24px;">${top5Cards}</div>

    <p class="section-label">Cost per task vs Intelligence Index</p>
    <div class="value-card">
      <p class="bench-desc" style="margin-bottom:12px;">Claude Sonnet & Opus (every reasoning effort) vs Gemini vs Grok. Each point is a model at a given reasoning effort. The dashed line is the frontier — the cheapest way to buy any given intelligence level. Anything off the line has a frontier option that's cheaper, smarter, or both.</p>
      ${renderValueChart(annotated)}
    </div>

    <p class="section-label">The frontier — worth paying for</p>
    <div class="value-card">
      <table class="value-table">
        <thead><tr><th>Model</th><th>Intelligence</th><th>$/task</th><th>vs previous</th></tr></thead>
        <tbody>${frontierRows}</tbody>
      </table>
      <p class="cl-note">Each row is a step up the frontier — the $/pt figure is the marginal cost of that extra intelligence over the row above. Rising $/pt = diminishing returns; pick the row where that stops being worth it for your use case.</p>
    </div>

    ${dominated.length ? `
    <p class="section-label">Skip these — a frontier option beats them outright</p>
    <div class="value-card">
      <div class="skip-list">${skipRows}</div>
    </div>` : ''}

    <p class="cl-note">${ce.note} Last updated ${fmt(ce.last_manual_update)}. <a href="${ce.url}" target="_blank" rel="noopener" style="color:var(--accent);">Source ↗</a></p>
  `;
}

// ---------- score breakdown (debug) ----------
// Everything here is written by refresh.py: each priority score is the mean of
// normalized benchmark inputs (score_detail), and the composite is the weighted
// mean over the priorities every model has (composite_basis).
const DIM_LABELS = { accuracy: 'Accuracy', long_context: 'Long context', agent: 'Agent', cost: 'Cost' };
const STATUS_TEXT = {
  measured: 'Measured on every benchmark',
  partial: 'Measured; some boards don\'t list it',
  provisional: 'Provisional: uses an older version\'s results',
  none: 'No benchmark data',
};
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const isProvisional = (m) => Object.values(m.score_detail || {}).some(x => x.status === 'provisional');
const getCoverage = (m) => m.coverage || {
  measured: Object.values(m.score_detail || {}).reduce((sum, det) => sum + (det.inputs || []).filter(i => !i.inherited).length, 0),
  total: Object.values(m.score_detail || {}).reduce((sum, det) => sum + (det.inputs || []).length, 0),
  provisional: Object.values(m.score_detail || {}).reduce((sum, det) => sum + (det.inputs || []).filter(i => i.inherited).length, 0),
};

function renderDebugTab(d) {
  const w = d.weights;
  const dims = Object.keys(w);
  const cb = d.composite_basis || { included: dims, excluded: {} };
  const incW = cb.included.reduce((t, k) => t + w[k], 0);
  const rows = [...d.models].sort((a, b) => (b.composite_unrounded ?? -1) - (a.composite_unrounded ?? -1));
  const rankIn = (m, k) => 1 + d.models.filter(o => o.per_priority[k] != null && o.per_priority[k] > m.per_priority[k]).length;
  const excluded = Object.entries(cb.excluded || {});

  const leaderRows = rows.map((m, i) => `<tr><td>${i + 1}. ${esc(m.name)} <span class="tier-chip" style="font-size:10px;padding:1px 5px;margin-left:4px;">${esc(m.target_effort)} effort</span></td><td>${m.composite_unrounded ?? '—'}</td><td>${m.composite_overall ?? '—'}</td></tr>`).join('');

  const cards = rows.map((m, idx) => {
    const pp = m.per_priority;
    const cov = getCoverage(m);
    const lines = dims.map(k => {
      const v = pp[k];
      const inComp = cb.included.includes(k);
      const eff = inComp && incW ? w[k] / incW : 0;
      const det = (m.score_detail || {})[k] || { status: 'none', inputs: [], missing: [] };
      const detCov = det.coverage || {
        measured: (det.inputs || []).filter(i => !i.inherited).length,
        total: (det.inputs || []).length,
        provisional: (det.inputs || []).filter(i => i.inherited).length,
      };
      const covSuffix = det.inputs.length > 0 ? ` (${detCov.measured}/${detCov.total})` : '';
      const inputs = det.inputs.map(i => {
        const flags = [i.inherited ? `inherited from ${esc(i.board_name)}` : '', i.stale ? `as of ${i.as_of}` : ''].filter(Boolean).join(', ');
        const runName = i.effort ? `${esc(i.name)} (${esc(i.effort)})` : esc(i.name);
        return `${runName}: ${esc(i.display)} → <b>${Math.round(i.score)}</b>${flags ? ` <span class="dbg-flag">(${flags})</span>` : ''}`;
      });
      if (det.inputs.length > 1) inputs.push(`mean of ${det.inputs.length} = ${v}`);
      if (det.missing.length) inputs.push(`not listed on ${esc(det.missing.join(', '))}`);
      if (!inComp) inputs.push('not in composite: most models have no data for this priority');
      return `<tr class="dbg-main">
        <td>${DIM_LABELS[k] || k} <span class="dbg-status dbg-${det.status}">${STATUS_TEXT[det.status]}${covSuffix}</span></td>
        <td>${v ?? '—'}</td>
        <td>${v != null ? '#' + rankIn(m, k) : '—'}</td>
        <td>${inComp ? '× ' + eff.toFixed(2) : '—'}</td>
        <td>${inComp && v != null ? (v * eff).toFixed(2) : '—'}</td>
      </tr><tr><td colspan="5" class="dbg-basis">${inputs.join('<br>') || 'No benchmark data yet.'}</td></tr>`;
    }).join('');
    const formula = cb.included.map(k => `${pp[k]}×${(w[k] / incW).toFixed(2)}`).join(' + ') + ` = ${m.composite_unrounded ?? '—'} → ${m.composite_overall ?? '—'}`;
    return `<div class="dbg-card">
      <div class="dbg-head">
        <div class="model-name-row"><p class="model-name">${idx + 1}. ${esc(m.name)}</p>${m.tier ? `<span class="tier-chip">${esc(m.tier)}</span>` : ''}${m.target_effort ? `<span class="tier-chip">${esc(m.target_effort)} effort</span>` : ''}${isProvisional(m) ? `<span class="calibrating-chip" title="${cov.measured}/${cov.total} benchmarks measured">Provisional (${cov.measured}/${cov.total})</span>` : `<span class="new-chip">${cov.measured}/${cov.total} measured</span>`}</div>
        <span class="dbg-total">Composite <b>${m.composite_overall ?? '—'}</b></span>
      </div>
      <table class="dbg-table">
        <thead><tr><th>Priority</th><th>Score</th><th>Rank</th><th>Weight</th><th>Adds</th></tr></thead>
        <tbody>${lines}<tr class="dbg-sum"><td>Composite (unrounded)</td><td></td><td></td><td></td><td>${m.composite_unrounded ?? '—'}</td></tr></tbody>
      </table>
      ${incW ? `<p class="dbg-formula">${formula}</p>` : ''}
    </div>`;
  }).join('');

  return `
    <p class="section-label" style="margin-top:8px;">Best overall card: how the winner is picked</p>
    <div class="dbg-card">
      <table class="dbg-table">
        <thead><tr><th>Model</th><th>Unrounded</th><th>Shown</th></tr></thead>
        <tbody>${leaderRows}</tbody>
      </table>
      <p class="cl-note">Ranked on the unrounded composite. ${excluded.length
        ? `Left out of every model's composite because most models have no data: ${excluded.map(([k, ms]) => `<b>${DIM_LABELS[k] || k}</b> (missing: ${esc(ms.join(', '))})`).join('; ')}. The remaining weights are rescaled to sum to 1. `
        : ''}${Object.keys(cb.unranked || {}).length
        ? `Not ranked, because data is missing for a priority the others are scored on: ${Object.entries(cb.unranked).map(([n, ks]) => `<b>${esc(n)}</b> (${ks.map(k => DIM_LABELS[k] || k).join(', ')})`).join('; ')}.`
        : ''}${!excluded.length && !Object.keys(cb.unranked || {}).length ? 'All four priorities have data for every model.' : ''}${Object.keys(d.dropped_benchmarks || {}).length
        ? ` Not scored, because the board has stopped testing current models: ${Object.entries(d.dropped_benchmarks).map(([n, why]) => `<b>${esc(n)}</b> (${esc(why)})`).join('; ')}.`
        : ''}</p>
    </div>

    <p class="section-label">Per model: every input behind every score</p>
    ${cards}
    <p class="cl-note">How a raw result becomes 0–100: most benchmarks use <b>value ÷ best on that leaderboard × 100</b>. Time horizons span orders of magnitude, so those lose <b>25 points per doubling</b> away from the best. A model a leaderboard hasn't tested yet borrows the result of its newest older version, if that version is less than one major version back, and is marked <b>Provisional (X/Y)</b> showing the ratio of directly measured to total benchmarks until the board lists it. A board that hasn't tested any model released in the last 90 days is dropped rather than left to feed old results. Cost is scaled across the tracked models on a log scale: the cheapest scores 100, the priciest 0. When a leaderboard can't be fetched, its last good values stay in use with their date shown. All numbers are computed by refresh.py; none are typed in by hand.</p>
  `;
}

let currentData = null;
let activeTab = 'models';
let modelDetailsOpen = false;

const WEIGHT_STORAGE_KEY = 'airank_custom_weights_v1';
const weightKeys = ['accuracy', 'long_context', 'agent', 'cost'];
const DIM_TITLES = {
  accuracy: 'Accuracy & low hallucination',
  long_context: 'Long instructions & context',
  agent: 'Autonomous agent',
  cost: 'Cost efficiency'
};

let weightState = {
  accuracy: 25,
  long_context: 25,
  agent: 25,
  cost: 25
};

let lockedWeights = {
  accuracy: false,
  long_context: false,
  agent: false,
  cost: false
};

const PRESETS = {
  equal: { label: 'Equal (25%)', weights: { accuracy: 25, long_context: 25, agent: 25, cost: 25 } },
  agent: { label: 'Agent Heavy (50%)', weights: { accuracy: 20, long_context: 20, agent: 50, cost: 10 } },
  accuracy: { label: 'Accuracy Heavy (50%)', weights: { accuracy: 50, long_context: 20, agent: 20, cost: 10 } },
  cost: { label: 'Budget / Cost (40%)', weights: { accuracy: 20, long_context: 20, agent: 20, cost: 40 } },
  context: { label: 'Context Heavy (50%)', weights: { accuracy: 25, long_context: 50, agent: 15, cost: 10 } },
};

function initWeights(data) {
  try {
    const saved = localStorage.getItem(WEIGHT_STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (
        typeof parsed.accuracy === 'number' &&
        typeof parsed.long_context === 'number' &&
        typeof parsed.agent === 'number' &&
        typeof parsed.cost === 'number'
      ) {
        const sum = parsed.accuracy + parsed.long_context + parsed.agent + parsed.cost;
        if (sum === 100) {
          weightState = { ...parsed };
          return;
        }
      }
    }
  } catch (e) {}

  if (data && data.weights) {
    const rawSum = Object.values(data.weights).reduce((s, v) => s + v, 0);
    if (rawSum > 0) {
      weightState = {
        accuracy: Math.round(data.weights.accuracy / rawSum * 100),
        long_context: Math.round(data.weights.long_context / rawSum * 100),
        agent: Math.round(data.weights.agent / rawSum * 100),
        cost: Math.round(data.weights.cost / rawSum * 100),
      };
      const total = weightState.accuracy + weightState.long_context + weightState.agent + weightState.cost;
      if (total !== 100) {
        weightState.accuracy += (100 - total);
      }
      return;
    }
  }

  weightState = { accuracy: 25, long_context: 25, agent: 25, cost: 25 };
}

function saveWeights() {
  try {
    localStorage.setItem(WEIGHT_STORAGE_KEY, JSON.stringify(weightState));
  } catch (e) {}
}

function updateHeaderWeightsMeta() {
  const wMap = { accuracy: 'acc', long_context: 'ctx', agent: 'agent', cost: 'cost' };
  const wStr = Object.entries(weightState).map(([k, v]) => `${v} ${wMap[k] || k}`).join(' · ');
  const wEl = document.getElementById('weights-meta');
  if (wEl) wEl.textContent = 'Weights: ' + wStr;
}

function recomputeWithWeights(d, w) {
  const totalW = w.accuracy + w.long_context + w.agent + w.cost;
  const decW = {
    accuracy: totalW ? w.accuracy / totalW : 0.25,
    long_context: totalW ? w.long_context / totalW : 0.25,
    agent: totalW ? w.agent / totalW : 0.25,
    cost: totalW ? w.cost / totalW : 0.25,
  };
  d.weights = decW;

  for (const m of d.models) {
    const pp = m.per_priority;
    const raw = (pp.accuracy ?? 0) * decW.accuracy +
                (pp.long_context ?? 0) * decW.long_context +
                (pp.agent ?? 0) * decW.agent +
                (pp.cost ?? 0) * decW.cost;
    m.composite_unrounded = Math.round(raw * 100) / 100;
    m.composite_overall = Math.round(raw);
  }
}

function renderWeightPanel() {
  const container = document.getElementById('weight-panel-container');
  if (!container) return;

  if (!document.getElementById('weight-card')) {
    const presetButtons = Object.entries(PRESETS).map(([key, p]) => {
      return `<button class="filter-chip preset-chip" id="preset-btn-${key}" onclick="applyPreset('${key}')">${esc(p.label)}</button>`;
    }).join('');

    const sliderItems = weightKeys.map(k => {
      return `
        <div class="weight-item" id="weight-item-${k}">
          <div class="weight-item-head">
            <span class="weight-name" title="${esc(DIM_TITLES[k] || k)}">${esc(DIM_LABELS[k] || k)}</span>
            <div style="display:flex;align-items:center;gap:6px;">
              <span class="weight-pct" id="weight-val-${k}">${weightState[k]}%</span>
              <button class="weight-lock-btn ${lockedWeights[k] ? 'locked' : ''}" id="lock-btn-${k}" onclick="toggleWeightLock('${k}')" title="Lock weight while adjusting others">${lockedWeights[k] ? '🔒' : '🔓'}</button>
            </div>
          </div>
          <input type="range" min="0" max="100" step="1" value="${weightState[k]}" id="slider-${k}" class="weight-slider" oninput="handleSliderChange('${k}', +this.value)" ${lockedWeights[k] ? 'disabled' : ''}>
        </div>
      `;
    }).join('');

    container.innerHTML = `
      <div class="weight-card" id="weight-card">
        <div class="weight-head">
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="weight-title">Custom Weightings</span>
            <span id="weight-total-badge" class="weight-total-badge">100% total</span>
          </div>
          <button class="filter-reset-link" onclick="resetWeights()">Reset to 25% each</button>
        </div>
        <div class="weight-presets">
          <span class="filter-label" style="min-width:auto;">Presets:</span>
          <div class="filter-chips">${presetButtons}</div>
        </div>
        <div class="weight-grid">
          ${sliderItems}
        </div>
      </div>
    `;
  }

  updateSliderUI();
}

function updateSliderUI() {
  const total = weightKeys.reduce((s, k) => s + weightState[k], 0);
  const totalBadge = document.getElementById('weight-total-badge');
  if (totalBadge) totalBadge.textContent = total + '% total';

  for (const k of weightKeys) {
    const slider = document.getElementById('slider-' + k);
    const valText = document.getElementById('weight-val-' + k);
    const lockBtn = document.getElementById('lock-btn-' + k);
    if (slider) {
      if (document.activeElement !== slider) {
        slider.value = weightState[k];
      }
      slider.disabled = !!lockedWeights[k];
    }
    if (valText) valText.textContent = weightState[k] + '%';
    if (lockBtn) {
      lockBtn.textContent = lockedWeights[k] ? '🔒' : '🔓';
      lockBtn.classList.toggle('locked', !!lockedWeights[k]);
    }
  }

  for (const [key, p] of Object.entries(PRESETS)) {
    const btn = document.getElementById('preset-btn-' + key);
    if (btn) {
      const match = weightKeys.every(k => weightState[k] === p.weights[k]);
      btn.classList.toggle('active', match);
    }
  }
}

function toggleWeightLock(k) {
  lockedWeights[k] = !lockedWeights[k];
  const lockedCount = weightKeys.filter(key => lockedWeights[key]).length;
  if (lockedCount >= weightKeys.length) {
    lockedWeights[k] = false;
  }
  updateSliderUI();
}

function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  weightState = { ...p.weights };
  lockedWeights = { accuracy: false, long_context: false, agent: false, cost: false };
  for (const k of weightKeys) {
    const slider = document.getElementById('slider-' + k);
    if (slider) slider.value = weightState[k];
  }
  updateSliderUI();
  saveWeights();
  applyWeightsAndRender();
}

function resetWeights() {
  applyPreset('equal');
}

function handleSliderChange(changedKey, targetVal) {
  targetVal = Math.max(0, Math.min(100, Math.round(targetVal)));
  if (lockedWeights[changedKey]) return;

  const currentVal = weightState[changedKey];
  const delta = targetVal - currentVal;
  if (delta === 0) return;

  const otherKeys = weightKeys.filter(k => k !== changedKey && !lockedWeights[k]);
  if (otherKeys.length === 0) {
    const slider = document.getElementById('slider-' + changedKey);
    if (slider) slider.value = currentVal;
    return;
  }

  const otherSum = otherKeys.reduce((sum, k) => sum + weightState[k], 0);

  let actualDelta = delta;
  if (actualDelta > otherSum) {
    actualDelta = otherSum;
    targetVal = currentVal + actualDelta;
  }

  weightState[changedKey] = targetVal;

  if (otherSum > 0) {
    let distributed = 0;
    const newOtherVals = {};
    for (let i = 0; i < otherKeys.length; i++) {
      const k = otherKeys[i];
      if (i === otherKeys.length - 1) {
        newOtherVals[k] = Math.max(0, otherSum - actualDelta - distributed);
      } else {
        const share = Math.round(weightState[k] - actualDelta * (weightState[k] / otherSum));
        const clamped = Math.max(0, share);
        newOtherVals[k] = clamped;
        distributed += clamped;
      }
    }
    for (const k of otherKeys) {
      weightState[k] = newOtherVals[k];
    }
  } else {
    const toDistribute = -actualDelta;
    const base = Math.floor(toDistribute / otherKeys.length);
    let rem = toDistribute % otherKeys.length;
    for (const k of otherKeys) {
      weightState[k] = base + (rem > 0 ? 1 : 0);
      if (rem > 0) rem--;
    }
  }

  let total = weightKeys.reduce((s, k) => s + weightState[k], 0);
  if (total !== 100) {
    const diff = 100 - total;
    const candidates = otherKeys.length > 0 ? otherKeys : [changedKey];
    candidates.sort((a, b) => weightState[b] - weightState[a]);
    weightState[candidates[0]] = Math.max(0, weightState[candidates[0]] + diff);
  }

  updateSliderUI();
  saveWeights();
  applyWeightsAndRender();
}

function applyWeightsAndRender() {
  if (!currentData) return;
  recomputeWithWeights(currentData, weightState);
  updateHeaderWeightsMeta();
  render(currentData);
}

const filterState = {
  vendors: new Set(),
  efforts: new Set(['high', 'medium']),
  excludedModels: new Set(),
};

function initFilters(data) {
  const allVendors = [...new Set(data.models.map(m => m.vendor))];
  const allEfforts = ['high', 'medium'];

  try {
    const saved = localStorage.getItem('airank_filters_v1');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed.vendors)) {
        filterState.vendors = new Set(parsed.vendors.filter(v => allVendors.includes(v)));
      } else {
        filterState.vendors = new Set(allVendors);
      }
      if (Array.isArray(parsed.efforts)) {
        filterState.efforts = new Set(parsed.efforts.filter(e => allEfforts.includes(e)));
      } else {
        filterState.efforts = new Set(allEfforts);
      }
      if (Array.isArray(parsed.excluded)) {
        filterState.excludedModels = new Set(parsed.excluded);
      } else {
        filterState.excludedModels = new Set();
      }
      return;
    }
  } catch (e) {}

  filterState.vendors = new Set(allVendors);
  filterState.efforts = new Set(allEfforts);
  filterState.excludedModels = new Set();
}

function saveFilters() {
  try {
    localStorage.setItem('airank_filters_v1', JSON.stringify({
      vendors: Array.from(filterState.vendors),
      efforts: Array.from(filterState.efforts),
      excluded: Array.from(filterState.excludedModels),
    }));
  } catch (e) {}
}

function isModelActive(m) {
  if (!filterState.vendors.has(m.vendor)) return false;
  const eff = (m.target_effort || 'medium').toLowerCase();
  if (!filterState.efforts.has(eff)) return false;
  if (filterState.excludedModels.has(m.id) || filterState.excludedModels.has(m.name)) return false;
  return true;
}

function toggleVendor(vendor) {
  if (filterState.vendors.has(vendor)) {
    filterState.vendors.delete(vendor);
  } else {
    filterState.vendors.add(vendor);
  }
  saveFilters();
  if (currentData) render(currentData);
}

function toggleEffort(effort) {
  const eff = effort.toLowerCase();
  if (filterState.efforts.has(eff)) {
    filterState.efforts.delete(eff);
  } else {
    filterState.efforts.add(eff);
  }
  saveFilters();
  if (currentData) render(currentData);
}

function toggleModelExclude(id, e) {
  if (e) {
    e.stopPropagation();
    e.preventDefault();
  }
  if (filterState.excludedModels.has(id)) {
    filterState.excludedModels.delete(id);
  } else {
    filterState.excludedModels.add(id);
  }
  saveFilters();
  if (currentData) render(currentData);
}

function resetAllFilters() {
  if (!currentData) return;
  filterState.vendors = new Set(currentData.models.map(m => m.vendor));
  filterState.efforts = new Set(['high', 'medium']);
  filterState.excludedModels = new Set();
  saveFilters();
  render(currentData);
}

function renderFilterBar(d, activeModels) {
  const allVendors = [...new Set(d.models.map(m => m.vendor))];
  const allEfforts = ['high', 'medium'];
  const hasAnyFilter = filterState.vendors.size < allVendors.length
    || filterState.efforts.size < allEfforts.length
    || filterState.excludedModels.size > 0;

  const vendorChips = allVendors.map(v => {
    const active = filterState.vendors.has(v);
    return `<button class="filter-chip ${active ? 'active' : 'inactive'}" onclick="toggleVendor('${esc(v)}')">${esc(v)} ${active ? '✓' : ''}</button>`;
  }).join('');

  const effortChips = allEfforts.map(e => {
    const active = filterState.efforts.has(e);
    const label = (e === 'high' ? 'High' : 'Medium') + ' effort';
    return `<button class="filter-chip ${active ? 'active' : 'inactive'}" onclick="toggleEffort('${e}')">${label} ${active ? '✓' : ''}</button>`;
  }).join('');

  const excludedChips = [...filterState.excludedModels].map(id => {
    const m = d.models.find(x => x.id === id || x.name === id);
    const label = m ? m.name : id;
    return `<span class="active-exclusion-chip" onclick="toggleModelExclude('${esc(id)}')" title="Click to unhide">${esc(label)} ✕</span>`;
  }).join('');

  const modelChecklist = d.models.map(m => {
    const active = isModelActive(m);
    return `
      <label class="model-checklist-item ${active ? '' : 'excluded'}">
        <input type="checkbox" ${active ? 'checked' : ''} onchange="toggleModelExclude('${esc(m.id)}')">
        <span>${esc(m.name)}</span>
      </label>
    `;
  }).join('');

  return `
    <div class="filter-bar">
      <div class="filter-head">
        <span class="title">Filter Top 5 & Rankings</span>
        ${hasAnyFilter ? `<button class="filter-reset-link" onclick="resetAllFilters()">Reset filters</button>` : ''}
      </div>
      <div class="filter-section">
        <span class="filter-label">Company:</span>
        <div class="filter-chips">${vendorChips}</div>
      </div>
      <div class="filter-section">
        <span class="filter-label">Effort:</span>
        <div class="filter-chips">${effortChips}</div>
      </div>
      ${excludedChips ? `
        <div class="active-exclusions-bar">
          <span class="filter-label" style="min-width:auto;">Excluded:</span>
          ${excludedChips}
        </div>
      ` : ''}
      <details class="filter-model-details" ${modelDetailsOpen ? 'open' : ''} ontoggle="modelDetailsOpen = this.open">
        <summary class="filter-summary">Filter specific models (${activeModels.length}/${d.models.length} active)</summary>
        <div class="model-checklist-grid">
          ${modelChecklist}
        </div>
      </details>
    </div>
  `;
}

async function load() {
  try {
    const res = await fetch('data.json?_=' + Date.now());
    const data = await res.json();
    currentData = data;
    initFilters(data);
    initWeights(data);
    recomputeWithWeights(data, weightState);
    document.getElementById('last-updated').textContent = 'Updated ' + fmt(data.last_updated);
    updateHeaderWeightsMeta();
    render(data);
  } catch (e) {
    document.getElementById('content').innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:40px 0;">Could not load data.json — has the scraper run yet?</p>';
  }
}

function render(d) {
  renderWeightPanel();

  const activeModels = d.models.filter(isModelActive)
    .sort((a,b) => (b.composite_unrounded ?? (b.composite_overall ?? -1)) - (a.composite_unrounded ?? (a.composite_overall ?? -1)));

  const filterContainer = document.getElementById('filter-bar-container');
  if (filterContainer) {
    filterContainer.innerHTML = renderFilterBar(d, activeModels);
  }

  const w = d.weights;
  const wPct = (k) => Math.round(w[k] * 100);
  const overall = d.best_overall;

  const isFiltered = activeModels.length < d.models.length;
  const overallModel = activeModels.length > 0 ? activeModels[0] : null;
  const others = activeModels.length > 1 ? activeModels.slice(1) : [];

  const ranked = (priority) => [...activeModels].sort((a,b) => {
    const sa = a.per_priority[priority];
    const sb = b.per_priority[priority];
    if (sa == null && sb == null) return 0;
    if (sa == null) return 1;
    if (sb == null) return -1;
    return sb - sa;
  });
  const rank = (model, priority) => ranked(priority).findIndex(m => m.id === model.id) + 1;

  // Claude lens: expand each tier × effort into a combo. Model name + capability
  // base are resolved live from d.models so a version bump flows through here;
  // effort deltas and Max costs come from data.json's claude_lens block.
  const cl = d.claude_lens;
  const claudeCombos = [];
  if (cl) {
    cl.tiers.forEach(tier => {
      const model = d.models.find(m => m.vendor === 'Anthropic' && m.tier === tier);
      const name = model ? (model.base_name || model.name.replace(/\s*\([^)]*\)$/, '')) : `Claude ${tier}`;
      const base = model && model.composite_overall != null ? model.composite_overall : 0;
      cl.efforts.forEach(e => {
        claudeCombos.push({
          name, effort: e.level,
          capability: Math.round(base + e.capability_delta),
          cost: +(((cl.cost_base || {})[tier] ?? 1) * e.cost_mult).toFixed(1),
        });
      });
    });
  }
  const byCapability = [...claudeCombos].sort((a,b) => b.capability - a.capability);
  const byCost = [...claudeCombos].sort((a,b) => a.cost - b.cost);
  const clRow = (c, i, val) => `<tr><td><span class="cl-rank">${i+1}.</span>${c.name}<span class="effort-chip">${c.effort}</span></td><td>${val}</td></tr>`;

  const wMap = { accuracy: 'acc', long_context: 'ctx', agent: 'agent', cost: 'cost' };
  const wSummary = Object.keys(w).map(k => `${wPct(k)} ${wMap[k] || k}`).join(' · ');

  let winnerHtml = '';
  if (!overallModel) {
    winnerHtml = `
      <p class="section-label">Best overall · ${wSummary}</p>
      <div class="winner-card" style="text-align:center;padding:36px 16px;">
        <p style="font-size:16px;font-weight:600;margin:0 0 6px;">No models match selected filters</p>
        <p style="font-size:12.5px;color:var(--text-muted);margin:0 0 16px;">Select at least one company or effort above, or reset filters.</p>
        <button class="refresh-btn" onclick="resetAllFilters()" style="padding:6px 14px;font-size:12.5px;">Reset all filters</button>
      </div>
    `;
  } else {
    const pp = overallModel.per_priority;
    const dims = Object.keys(w).map(k => `${k === 'long_context' ? 'long context' : k} ${pp[k] ?? '—'}`).join(', ');
    const runnerStr = others.slice(0, 4).map(m => `${m.name} ${m.composite_unrounded != null ? m.composite_unrounded.toFixed(2) : (m.composite_overall ?? '—')}`).join('; ');
    const filterNote = isFiltered ? `Filtered view (${activeModels.length} of ${d.models.length} models active). ` : '';
    const rationale = `${filterNote}Scores: ${dims} → ${overallModel.composite_unrounded != null ? overallModel.composite_unrounded.toFixed(2) : overallModel.composite_overall}. Next: ${runnerStr || 'none'}.`;

    winnerHtml = `
      <p class="section-label">Best overall · ${wSummary}${isFiltered ? ` (${activeModels.length}/${d.models.length} active)` : ''}</p>
      <div class="winner-card">
        <div class="winner-head">
          <div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
              <span class="badge">${isFiltered ? 'Filtered #1' : 'Recommended'}</span>
              <button class="hide-btn" style="font-size:11px;border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:2px 7px;" title="Exclude ${esc(overallModel.name)}" onclick="toggleModelExclude('${esc(overallModel.id)}')">✕ Exclude</button>
            </div>
            <p class="winner-name">${esc(overallModel.name)}</p>
            <p class="winner-vendor">${esc(overallModel.vendor)} · ${overallModel.target_effort ? `${esc(overallModel.target_effort)} effort · ` : ''}${isNaN(daysSince(overallModel.released)) ? '' : `released ${daysSince(overallModel.released)}d ago`}</p>
          </div>
          <div class="composite">
            <p class="composite-label">Composite</p>
            <p class="composite-value">${overallModel.composite_overall ?? '—'}<span class="denom">/100</span></p>
          </div>
        </div>
        <div class="winner-grid">
          ${Object.keys(w).map(k => {
            const dimLabels = { accuracy: 'Accuracy', long_context: 'Long context', agent: 'Agent', cost: 'Cost' };
            return `
              <div>
                <p class="label">${dimLabels[k] || k} · ${wPct(k)}%</p>
                <p class="val">${overallModel.per_priority[k] ?? '—'} <span class="rank">${overallModel.per_priority[k] != null ? `· #${rank(overallModel, k)}` : ''}</span></p>
              </div>
            `;
          }).join('')}
        </div>
        <p class="rationale">${rationale}</p>
        ${others.length > 0 ? `
          <div class="runners" style="display:flex;flex-direction:column;gap:6px;margin-top:16px;padding-top:14px;border-top:0.5px solid var(--border);">
            <div style="font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;margin-bottom:2px;">Top 5 Leaders (Click ✕ to exclude):</div>
            ${others.slice(0, 4).map((m, i) => {
              const ordinals = ['2nd', '3rd', '4th', '5th'];
              return `
                <div class="runner-item">
                  <div style="display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;">
                    <span style="font-weight:600;color:var(--text-muted);font-size:11.5px;min-width:24px;">${ordinals[i] || (i + 2) + 'th'}</span>
                    <span style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(m.name)}</span>
                    <span class="tier-chip" style="font-size:10px;padding:1px 5px;">${esc(m.target_effort || 'medium')}</span>
                  </div>
                  <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
                    <span style="font-weight:600;font-variant-numeric:tabular-nums;">${m.composite_overall ?? '—'}</span>
                    <button class="hide-btn" title="Exclude ${esc(m.name)}" onclick="toggleModelExclude('${esc(m.id)}')">✕</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }

  const html = `
    ${winnerHtml}

    <p class="section-label">Best per priority${isFiltered ? ` (${activeModels.length}/${d.models.length} active)` : ''}</p>
    <div class="priority-grid">
      ${Object.keys(w).map(k => {
        const labels = {
          agent: 'Autonomous agent',
          accuracy: 'Accuracy & low hallucination',
          long_context: 'Long instructions & context',
          cost: 'Cost efficiency (cost / task)'
        };
        const rankedList = ranked(k);
        if (!rankedList.length || !rankedList.some(m => m.per_priority[k] != null)) {
          return `<div class="pri-card"><p class="pri-tag">${labels[k] || k}</p><p class="pri-summary">No active models for this priority with current filters.</p></div>`;
        }
        return `<div class="pri-card"><p class="pri-tag">${labels[k] || k}</p><table class="pri-rank">${rankedList.map((m, i) => {
          const score = m.per_priority[k];
          const det = (m.score_detail || {})[k] || {};
          const st = det.status;
          const dCov = det.coverage || {
            measured: (det.inputs || []).filter(x => !x.inherited).length,
            total: (det.inputs || []).length,
            provisional: (det.inputs || []).filter(x => x.inherited).length,
          };
          const provBadge = st === 'provisional' ? `<span class="est-chip" title="${dCov.measured} of ${dCov.total} benchmarks measured (${dCov.provisional} prov.)">prov. (${dCov.measured}/${dCov.total})</span>` : '';
          const effBadge = m.target_effort ? `<span class="tier-chip" style="font-size:10px;padding:1px 5px;margin-left:4px;">${esc(m.target_effort)}</span>` : '';
          return `<tr><td>${i+1}. ${esc(m.name)}${effBadge}${provBadge}</td><td>${score != null ? score : '—'}</td></tr>`;
        }).join('')}</table></div>`;
      }).join('')}
    </div>

    <div class="tabs">
      <button class="tab-btn ${activeTab === 'models' ? 'active' : ''}" data-tab="models">Latest releases</button>
      <button class="tab-btn ${activeTab === 'details' ? 'active' : ''}" data-tab="details">Benchmark details</button>
      ${d.cost_efficiency ? `<button class="tab-btn ${activeTab === 'value' ? 'active' : ''}" data-tab="value">Cost vs intelligence</button>` : ''}
      ${cl ? `<button class="tab-btn ${activeTab === 'claude' ? 'active' : ''}" data-tab="claude">Claude</button>` : ''}
      <button class="tab-btn ${activeTab === 'debug' ? 'active' : ''}" data-tab="debug">Score breakdown</button>
    </div>

    <div id="pane-models" class="tab-pane ${activeTab === 'models' ? 'active' : ''}">
      ${[...new Set(d.models.map(m => m.vendor))].map(vendor => {
        const tiers = d.models.filter(m => m.vendor === vendor);
        if (!tiers.length) return '';
        return `
          <p class="section-label" style="margin-top:16px;">${vendor}</p>
          <div class="model-grid" style="margin-bottom:8px;">
            ${tiers.map(m => {
              const cov = getCoverage(m);
              const active = isModelActive(m);
              return `
              <div class="model-card ${active ? '' : 'is-filtered-out'}" data-toggle>
                <div class="model-head">
                  <div>
                    <div class="model-name-row">
                      <p class="model-name">${esc(m.name)}</p>
                      ${m.tier ? `<span class="tier-chip">${esc(m.tier)}</span>` : ''}
                      ${m.target_effort ? `<span class="tier-chip" title="Target reasoning effort: ${esc(m.target_effort)}">${esc(m.target_effort)} effort</span>` : ''}
                      ${isProvisional(m)
                        ? `<span class="calibrating-chip" title="${cov.measured} of ${cov.total} benchmarks directly measured, ${cov.provisional} inherited from older versions">Provisional (${cov.measured}/${cov.total})</span>`
                        : `<span class="cov-chip" title="All ${cov.total} benchmarks directly measured">${cov.measured}/${cov.total} measured</span>`}
                      ${!isNaN(daysSince(m.released)) && daysSince(m.released) <= 14 ? `<span class="new-chip">${daysSince(m.released)}d ago</span>` : ''}
                    </div>
                    <p class="model-vendor">${fmt(m.released)}</p>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px;">
                    <button class="hide-btn" style="border:0.5px solid var(--border);border-radius:4px;padding:2px 7px;" title="${active ? 'Exclude from rankings' : 'Include in rankings'}" onclick="toggleModelExclude('${esc(m.id)}', event)">${active ? '✕ Hide' : '+ Include'}</button>
                    <span class="chev">▼</span>
                  </div>
                </div>
                <div class="model-changelog">
                  <p><span class="changelog-head">vs ${esc(m.previous)}:</span> ${esc(m.changelog)}</p>
                  <a href="${m.release_notes_url}" target="_blank" rel="noopener">Release notes ↗</a>
                  <div class="model-bench-meta" style="margin-top:10px;padding-top:8px;border-top:0.5px solid var(--border);font-size:12px;color:var(--text-muted);line-height:1.5;">
                    <p style="margin:0 0 3px;"><b>Benchmarked effort:</b> ${esc(m.target_effort || 'medium')} effort</p>
                    <p style="margin:0 0 3px;"><b>Directly measured (${cov.measured}/${cov.total}):</b> ${Object.values(m.score_detail || {}).flatMap(d => (d.inputs || []).filter(i => !i.inherited).map(i => i.name)).join(', ') || 'None'}</p>
                    ${cov.provisional > 0 ? `<p style="margin:0;"><b>Provisional / inherited (${cov.provisional}/${cov.total}):</b> ${Object.values(m.score_detail || {}).flatMap(d => (d.inputs || []).filter(i => i.inherited).map(i => `${i.name} (from ${i.board_name})`)).join(', ')}</p>` : ''}
                  </div>
                </div>
              </div>
            `;}).join('')}
          </div>
        `;
      }).join('')}
    </div>

    <div id="pane-details" class="tab-pane ${activeTab === 'details' ? 'active' : ''}">
      ${['agent','accuracy','long_context','cost'].filter(cat => (d.benchmarks[cat] || []).length).map(cat => {
        const labels = {agent:'Autonomous agents', accuracy:'Accuracy & low hallucination', long_context:'Long instructions & context', cost:'Cost'};
        return `
          <p class="section-label" style="margin-top:8px;">${labels[cat]}</p>
          <div class="bench-grid">
            ${d.benchmarks[cat].map(b => `
              <div class="bench-card">
                <div class="bench-head">
                  <p class="bench-name">${b.name}</p>
                  <a class="bench-link" href="${b.url}" target="_blank" rel="noopener">open ↗</a>
                </div>
                <p class="bench-desc">${b.description}${b.as_of ? ` · ${b.scope || 'whole board'} · fetched ${fmt(b.as_of)}` : ''}${b.stale ? ' <span class="calibrating-chip">stale</span>' : ''}</p>
                <table class="bench-table">
                  ${(b.top5 || b.top3 || []).map((row,i) => `<tr><td>${i+1}. ${row.model}</td><td>${row.value}</td></tr>`).join('')}
                </table>
              </div>
            `).join('')}
          </div>
        `;
      }).join('')}
    </div>

    ${d.cost_efficiency ? `
    <div id="pane-value" class="tab-pane ${activeTab === 'value' ? 'active' : ''}">
      ${renderValueTab(d)}
    </div>` : ''}

    ${cl ? `
    <div id="pane-claude" class="tab-pane ${activeTab === 'claude' ? 'active' : ''}">
      <div class="subtabs">
        <button class="subtab-btn active" data-sub="cap">Capability</button>
        <button class="subtab-btn" data-sub="cost">Max plan cost</button>
      </div>

      <div id="sub-cap" class="subpane active">
        <p class="section-label" style="margin-top:4px;">Model × effort — most capable first</p>
        <div class="cl-card">
          <table class="cl-table">
            ${byCapability.map((c,i) => clRow(c, i, c.capability)).join('')}
          </table>
        </div>
        <p class="cl-note">Estimated capability (0–100), each Claude tier run at every reasoning-effort level. A lower model at high effort can outrank a higher model at low effort.</p>
      </div>

      <div id="sub-cost" class="subpane">
        <p class="section-label" style="margin-top:4px;">Claude Max quota burn — lightest first</p>
        <div class="cl-card">
          <table class="cl-table">
            ${byCost.map((c,i) => clRow(c, i, c.cost + '×')).join('')}
          </table>
        </div>
        <p class="cl-note">Relative session usage against your Claude Max limits, × the lightest combo (${byCost[0] ? byCost[0].name + ' at ' + byCost[0].effort : '—'}). Higher = burns your 5-hour / weekly caps faster. Bigger models and higher effort cost more.</p>
      </div>

      <p class="cl-note" style="margin-top:14px;">${cl.note}</p>
    </div>` : ''}

    <div id="pane-debug" class="tab-pane ${activeTab === 'debug' ? 'active' : ''}">
      ${renderDebugTab(d)}
    </div>

    <p class="footer-note">${d.data_status === 'initial_estimates' ? 'Showing seeded estimates — scraper will replace with live numbers on first run. ' : ''}<a href="https://github.com/zmirburger/ai-leaderboard" target="_blank" rel="noopener">Source on GitHub</a></p>
  `;
  document.getElementById('content').innerHTML = html;
  document.getElementById('content').classList.remove('loading');

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      activeTab = btn.dataset.tab;
      document.getElementById('pane-' + activeTab).classList.add('active');
    });
  });
  document.querySelectorAll('[data-toggle]').forEach(card => {
    card.addEventListener('click', () => card.classList.toggle('open'));
  });
  document.querySelectorAll('.subtab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.subtab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.subpane').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('sub-' + btn.dataset.sub).classList.add('active');
    });
  });

  const tip = document.getElementById('value-tooltip');
  if (tip) {
    document.querySelectorAll('#value-chart circle[data-tip]').forEach(dot => {
      const showTip = (evt) => {
        const wrap = dot.closest('.value-chart-wrap').getBoundingClientRect();
        tip.textContent = dot.dataset.tip;
        tip.style.display = 'block';
        const tipWidth = tip.offsetWidth;
        let left = evt.clientX - wrap.left + 12;
        left = Math.min(left, wrap.width - tipWidth - 4);
        left = Math.max(left, 4);
        let top = evt.clientY - wrap.top - 10;
        tip.style.left = left + 'px';
        tip.style.top = top + 'px';
      };
      dot.addEventListener('mousemove', showTip);
      dot.addEventListener('mouseenter', showTip);
      dot.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    });
  }
}

load();
</script>
</body>
</html>
